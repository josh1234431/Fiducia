<!-- Fiducia app icon, dark. The F is the top-left fiducial, the bottom-right
     corner closes the frame, and the teal dot is the principal point: the
     exact centre, where lines between opposite marks cross. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20252a"/>
      <stop offset="1" stop-color="#0e1013"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#tile)"/>
  <g stroke="#edf0f2"><path d="M14 44V14h22M14 25.5h10M50 41v9h-9" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
  <circle cx="32" cy="32" r="4.75" fill="#3fc4a8"/>
</svg>
