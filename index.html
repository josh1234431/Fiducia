<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fiducia</title>
    <!--
      Manrope carries everything proportional, Inter every value an
      operator compares against another value. Fetched from Google Fonts when
      online; the stacks in theme.css fall back to the system sans and mono so
      the app is fully usable offline. Vendoring the woff2 files into
      resources/fonts is the next step for a guaranteed-offline build.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
